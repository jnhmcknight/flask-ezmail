[project]
name = "flask-ezmail-ng"
version = "1.0.3"
description = "Flask extension for sending email"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jared McKnight", email = "jmcknight@archertech.ca" },
]
requires-python = ">=3.10"
dependencies = [
    "blinker>=1.6",
    "flask>=2.3",
    "inscriptis>=2.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jnhmcknight/flask-ezmail"

[project.optional-dependencies]
ses = ["boto3>=1.34"]

[dependency-groups]
dev = [
    "boto3>=1.34",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "flask_ezmail"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
packages = ["flask_ezmail"]
strict = true

[[tool.mypy.overrides]]
module = ["inscriptis.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
